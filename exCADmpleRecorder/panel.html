<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>exCADmple · 语音录制</title>
  <style>
    :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
    body { margin: 14px; }
    button, select, input { font: inherit; padding: 5px 8px; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin: 10px 0; }
    h2 { font-size: 15px; margin-bottom: 6px; }
    p { margin: 6px 0; overflow-wrap: anywhere; }
    #status { min-height: 1.4em; }
    #status.error { color: #d64e44; }
    audio { width: 100%; }
    ol { padding-left: 22px; }
    li { margin: 7px 0; padding: 7px; border-bottom: 1px solid #8886; }
    li.active { background: #3c91d444; }
    small { opacity: .8; }
    #offset { width: 68px; }
  </style>
  <script src="panel.js" defer></script>
</head>
<body>
  <div class="actions">
    <button id="record">录制语音与建模</button>
    <button id="history">仅记录建模</button>
    <button id="open">打开会话</button>
  </div>
  <p id="status" role="status">正在连接 Fusion…</p>
  <section id="review" hidden>
    <h2 id="design"></h2>
    <small id="folder"></small>
    <div class="actions" id="attach">
      <label>WAV 开始偏移（秒） <input id="offset" type="number" step="0.1" value="0"></label>
      <button id="wav">导入 WAV</button>
    </div>
    <div class="actions" id="transcription">
      <label>转写语言
        <select id="language">
          <option value="">自动识别</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <button id="transcribe">转写</button>
    </div>
    <audio id="audio" controls></audio>
    <h2>建模操作</h2>
    <ol id="steps"></ol>
    <p id="unassigned"></p>
  </section>
</body>
</html>
