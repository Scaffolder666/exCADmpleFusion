name: In-viewport Fusion HiM walkthrough
on:
  push:
    branches: [fusion-him-viewport-walkthrough]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript player and canvas-overlay syntax
        run: |
          node --check ui/reference/player.js
          node --check ui/viewport_walkthrough/walkthrough.js
      - name: Verify Fusion/Python syntax
        run: python -m compileall -q core exCADmpleFusion.py tools/walkthrough
      - name: Run tutorial and UI contract unit tests
        run: python -m unittest tests.test_viewport_walkthrough tests.test_operation_walkthrough tests.test_packages -v
