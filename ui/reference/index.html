<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>exCADmple · Reference</title>
  <!-- Assets carry the page's ?v= version so Fusion never runs a cached
       old copy after the add-in is updated. -->
  <script>document.write('<link rel="stylesheet" href="style.css' + location.search + '">');</script>
</head>
<body>
  <!-- Version A control panel. It runs in the second (reference) Fusion
       instance; that instance's canvas is the interactive reference viewport. -->
  <header class="bar">
    <div class="brand"><strong>exCADmple</strong><span>Design tutorial</span></div>
    <button id="import" class="quiet" type="button" title="Open a .excadmple or .json tutorial">+ Import</button>
  </header>
  <h1 id="title" class="title">—</h1>

  <div class="transport" role="group" aria-label="Playback">
    <button id="back" title="Step backward (plays the step in reverse)" aria-label="Step backward"><span class="control-icon previous" aria-hidden="true"></span></button>
    <button id="play" title="Play / pause" aria-label="Play"><span class="control-icon play-icon" aria-hidden="true"></span></button>
    <button id="replay" title="Replay from the start" aria-label="Replay"><span class="control-icon replay-icon" aria-hidden="true"></span></button>
    <button id="forward" title="Step forward" aria-label="Step forward"><span class="control-icon next" aria-hidden="true"></span></button>
    <span id="clock" class="clock">00:00</span>
  </div>
  <div class="scrub-row">
    <label for="scrub">Overall progress</label>
    <input id="scrub" type="range" min="0" max="100" step="0.5" value="0"
           aria-label="Seek across the whole tutorial; 0% or 100% shows the full model">
    <output id="scrubValue" for="scrub">0%</output>
  </div>
  <div id="mode" class="mode">
    <span id="modeText">Whole design process</span>
    <button id="showMore" class="link" type="button" hidden>Show more</button>
    <button id="showAll" class="link" type="button" hidden>Show all steps</button>
  </div>
  <ol id="rail" class="rail" aria-label="Design steps"></ol>

  <footer class="foot">
    <label>Speed <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"> <output id="speedValue">1×</output></label>
    <div class="options">
      <label title="Automatically frame the relevant geometry when an operation starts"><input id="autoFocus" type="checkbox"> Auto-focus</label>
    </div>
    <div class="authoring">
      <button id="demo" class="link" type="button">Try example</button>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </footer>
  <audio id="audio" preload="metadata"></audio>
  <script>
    document.write('<script src="frame_clock.js' + location.search + '"><\/script>' +
                   '<script src="player.js' + location.search + '"><\/script>');
  </script>
</body>
</html>
