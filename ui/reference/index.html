<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>exCADmple · Reference</title>
  <!-- Assets carry the page's ?v= version so Fusion never runs a cached
       old copy after the add-in is updated. -->
  <script>document.write('<link rel="stylesheet" href="style.css' + location.search + '">');</script>
</head>
<body>
  <!-- One visible Fusion viewport: the user's editable design and an independent,
       read-only Reference Model. The right-hand panel controls the walkthrough. -->
  <header class="bar">
    <div class="brand"><strong>exCADmple</strong><span>Design tutorial</span></div>
    <button id="import" class="quiet" type="button" title="Open a .excadmple or .json tutorial">+ Import</button>
  </header>
  <h1 id="title" class="title">—</h1>

  <div class="transport" role="group" aria-label="Playback">
    <button id="back" title="Step backward (plays the step in reverse)" aria-label="Step backward"><span class="control-icon previous" aria-hidden="true"></span></button>
    <button id="play" title="Play / pause" aria-label="Play"><span class="control-icon play-icon" aria-hidden="true"></span></button>
    <button id="replay" title="Replay from the start" aria-label="Replay"><span class="control-icon replay-icon" aria-hidden="true"></span></button>
    <button id="forward" title="Step forward" aria-label="Step forward"><span class="control-icon next" aria-hidden="true"></span></button>
    <span id="clock" class="clock">00:00</span>
  </div>
  <div class="scrub-row">
    <label for="scrub">Overall progress</label>
    <input id="scrub" type="range" min="0" max="100" step="0.5" value="0"
           aria-label="Seek across the whole tutorial; 0% or 100% shows the full model">
    <output id="scrubValue" for="scrub">0%</output>
  </div>
  <div id="mode" class="mode">
    <span id="modeText">Whole design process</span>
    <button id="showMore" class="link" type="button" hidden>Show more</button>
    <button id="showAll" class="link" type="button" hidden>Show all steps</button>
  </div>
  <section id="walkthrough" class="walkthrough" aria-label="Current CAD operation walkthrough" hidden>
    <div class="walk-head">
      <span class="walk-eyebrow">OPERATION WALKTHROUGH</span>
      <span id="walkKind" class="walk-kind">Tool</span>
    </div>
    <h2 id="walkTitle">—</h2>
    <p id="walkDescription" class="walk-description"></p>
    <p id="walkOrigin" class="walk-origin"></p>
    <div class="walk-tool-row" aria-label="Fusion tool used in this step">
      <div class="walk-tool-copy">
        <strong id="walkTool">CAD tool</strong>
        <span id="walkToolPath">Find this tool in Fusion</span>
      </div>
      <button id="walkTry" type="button" title="Pause playback and start the actual native command in your design">Try in my design</button>
    </div>
    <div class="walk-geometry" id="walkFocus">Reference geometry in the same viewport</div>
    <div id="walkVideoWrap" class="walk-video-wrap" hidden>
      <div class="walk-video-window">
        <video id="walkVideo" playsinline muted preload="metadata" aria-label="Real CAD operation recording"></video>
      </div>
    </div>
    <div class="walk-video-meta"><p id="walkVideoNote" class="walk-video-note"></p><button id="walkSound" type="button" title="Toggle sound from the original operation recording">Sound off</button></div>
    <p id="walkNoVideo" class="walk-video-placeholder">No original operation recording included.</p>
    <div id="walkMoments" class="walk-moments" aria-label="Operation moments"></div>
    <div class="walk-transport">
      <button id="walkPrevious" type="button">‹ Previous action</button>
      <button id="walkReplay" type="button">↺ Repeat</button>
      <button id="walkNext" type="button">Next action ›</button>
    </div>
  </section>
  <ol id="rail" class="rail" aria-label="Design steps"></ol>

  <footer class="foot">
    <label>Speed <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"> <output id="speedValue">1×</output></label>
    <div class="options">
      <label title="Automatically frame the relevant geometry when an operation starts"><input id="autoFocus" type="checkbox"> Auto-focus</label>
    </div>
    <div class="authoring">
      <button id="demo" class="link" type="button">Try example</button>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </footer>
  <audio id="audio" preload="metadata"></audio>
  <script>
    document.write('<script src="frame_clock.js' + location.search + '"><\/script>' +
                   '<script src="walkthrough.js' + location.search + '"><\/script>' +
                   '<script src="player.js' + location.search + '"><\/script>');
  </script>
</body>
</html>
