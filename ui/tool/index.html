<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>exCADmple · Tool</title>
  <style>
    :root { color-scheme:light; --ink:#1f2a37; --muted:#6b7785; --line:#e3e7ec; --panel:#f6f7f9;
            --accent:#c2570c; --accent-soft:#fff4ec; }
    html, body { margin:0; background:#fff; color:var(--ink);
                 font:13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .head { padding:8px 12px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--line);
            letter-spacing:.04em; text-transform:uppercase; }
    .step { padding:8px 12px 0; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden;
            text-overflow:ellipsis; }
    .tools { padding:8px 12px 12px; display:flex; flex-direction:column; gap:8px; }
    .tool { display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--line);
            border-radius:10px; background:#fff; }
    .tool.active { border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 2px var(--accent-soft); }
    .icon { width:40px; height:40px; flex:none; border-radius:8px; background:var(--panel);
            display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px;
            color:var(--muted); overflow:hidden; }
    .icon img { width:32px; height:32px; }
    .tool.active .icon { color:var(--accent); }
    .text { flex:1; min-width:0; }
    .name { font-weight:700; font-size:15px; }
    .path { font-size:11px; color:var(--muted); }
    .use { flex:none; font-size:12px; padding:4px 12px; border-radius:6px; border:1px solid var(--accent);
           background:#fff; color:var(--accent); cursor:pointer; }
    .tool.active .use { background:var(--accent); color:#fff; }
    .missing .name { font-weight:400; color:var(--muted); }
    .empty { padding:16px 12px; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <div class="head">Tool in use</div>
  <div class="step" id="step"></div>
  <div class="tools" id="tools"><div class="empty">Play a step to see the tool it uses.</div></div>
  <script>
    "use strict";
    const T = { step: "", tools: [], active: "" };
    function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function send(action, payload) {
      if (window.adsk && typeof window.adsk.fusionSendData === "function") window.adsk.fusionSendData(action, JSON.stringify(payload || {}));
    }
    function render() {
      document.getElementById("step").textContent = T.step;
      const box = document.getElementById("tools");
      box.replaceChildren();
      if (!T.tools.length) { box.appendChild(el("div", "empty", "Play a step to see the tool it uses.")); return; }
      const active = T.active || (T.tools.length === 1 ? T.tools[0].label : "");
      for (const tool of T.tools) {
        const row = el("div", "tool" + (tool.label === active ? " active" : "") + (tool.found ? "" : " missing"));
        const icon = el("div", "icon");
        if (tool.icon) { const img = document.createElement("img"); img.src = tool.icon; img.alt = ""; icon.appendChild(img); }
        else icon.textContent = (tool.name || tool.label || "?").charAt(0).toUpperCase();
        const text = el("div", "text");
        text.appendChild(el("div", "name", tool.found ? tool.name : tool.label));
        text.appendChild(el("div", "path", tool.found ? tool.path.slice(0, -1).join(" › ") : "Not found in this workspace"));
        row.append(icon, text);
        if (tool.found) {
          const use = el("button", "use", "Use");
          use.type = "button";
          use.addEventListener("click", () => send("use_tool", { label: tool.label }));
          row.appendChild(use);
        }
        box.appendChild(row);
      }
    }
    window.fusionJavaScriptHandler = {
      handle(action, raw) {
        try {
          const data = JSON.parse(raw || "{}");
          if (action === "tool") { T.step = data.step || ""; T.tools = data.tools || []; T.active = data.active || ""; render(); }
          else if (action === "active") { T.active = data.label || ""; render(); }
        } catch (_) { /* never break the Fusion bridge */ }
        return "OK";
      },
    };
    send("ready", {});
    render();
  </script>
</body>
</html>
