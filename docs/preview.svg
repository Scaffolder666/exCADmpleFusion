<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-labelledby="title desc">
<title id="title">exCADmple Blender 单视口播放器布局预览</title>
<desc id="desc">概念界面图，展示同一 Blender 3D Viewport 中的动态手机支架参考、用户可编辑模型、三维虚拟指示点和右侧 HiM 风格播放面板；并非 Blender 实际截图。</desc>
<defs>
  <linearGradient id="bg" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#333943"/><stop offset="1" stop-color="#1b242d"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#b1ddff"/><stop offset="1" stop-color="#5a9dd6"/></linearGradient>
  <linearGradient id="side" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#427aac"/><stop offset="1" stop-color="#1f4777"/></linearGradient>
  <linearGradient id="pan" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#222934"/><stop offset="1" stop-color="#181e27"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#070b0e" flood-opacity=".48"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="scene"><rect x="52" y="82" width="1338" height="700"/></clipPath>
</defs>
