<!-- Right-side overlay: positioned inside same viewport -->
<g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
<rect x="1082" y="102" width="296" height="650" rx="14" fill="url(#pan)" stroke="#596879" stroke-width="1.2"/>
<text x="1102" y="134" font-size="18" fill="#eaf4fa" font-weight="700">exCADmple</text>
<text x="1350" y="134" font-size="18" fill="#acbccb">×</text>
<text x="1102" y="156" font-size="12" fill="#95a9bc">Phone Stand · 9 Design Decisions</text>
<rect x="1102" y="173" width="60" height="39" rx="8" fill="#313d4d"/><text x="1123" y="200" font-size="18" fill="#e9eff7">❮❮</text>
<rect x="1170" y="173" width="120" height="39" rx="8" fill="#65a9ee"/><text x="1206" y="200" font-size="17" fill="#15283d" font-weight="700">▶ Play</text>
<rect x="1298" y="173" width="60" height="39" rx="8" fill="#313d4d"/><text x="1317" y="200" font-size="18" fill="#e9eff7">❯❯</text>
<text x="1102" y="235" font-size="11" letter-spacing="1.1" fill="#8e9dad">PLAYBACK</text>
<text x="1300" y="235" font-size="11" fill="#a4b5c6">03 / 09</text>
<rect x="1102" y="248" width="256" height="10" rx="5" fill="#3a4758"/>
<rect x="1102" y="248" width="129" height="10" rx="5" fill="#65a9ee"/>
<circle cx="1231" cy="253" r="6" fill="#cde6ff"/>
<text x="1102" y="285" fill="#95a8bb" font-size="11" letter-spacing=".8">DESIGN STEPS</text>
<text x="1314" y="285" fill="#aab9c9" font-size="11">03 / 09</text>
<rect x="1102" y="301" width="256" height="55" rx="9" fill="#2d3644"/>
<rect x="1107" y="311" width="4" height="33" rx="2" fill="#69a8f4"/>
<text x="1120" y="323" fill="#7eb6f4" font-size="11">01</text><text x="1150" y="324" fill="#e4edf5" font-size="12">Establish the footprint</text>
<text x="1150" y="343" fill="#8b9baa" font-size="11">Sketch → Extrude</text>
<rect x="1102" y="362" width="256" height="55" rx="9" fill="#2d3644"/>
<rect x="1107" y="372" width="4" height="33" rx="2" fill="#e2a36c"/>
<text x="1120" y="385" fill="#e9ad7b" font-size="11">02</text><text x="1150" y="386" fill="#e4edf5" font-size="12">Choose a viewing angle</text>
<text x="1150" y="405" fill="#8b9baa" font-size="11">Rotate / Extrude</text>
<rect x="1102" y="423" width="256" height="55" rx="9" fill="#29415b" stroke="#6ba6e5" stroke-width="1.2"/>
<rect x="1107" y="432" width="4" height="35" rx="2" fill="#7cdea7"/>
<text x="1120" y="446" fill="#a6e5c1" font-size="11">03</text><text x="1150" y="446" fill="#f0f5fa" font-weight="700" font-size="12">Prevent phone slipping</text>
<text x="1150" y="465" fill="#9ec7ec" font-size="11">EXTRUDE · Drag handle</text>
<text x="1114" y="501" fill="#7d91a6" font-size="12">… 6 more steps</text>
<rect x="1102" y="517" width="256" height="103" rx="10" fill="#29313e"/>
<text x="1114" y="539" fill="#86bdf6" font-size="11" font-weight="700" letter-spacing=".7">WHY THIS DECISION?</text>
<text x="1114" y="565" fill="#e1eaf1" font-size="12">A small lip prevents slipping</text>
<text x="1114" y="583" fill="#e1eaf1" font-size="12">while leaving room to reach</text>
<text x="1114" y="601" fill="#e1eaf1" font-size="12">the bottom of the device.</text>
<text x="1102" y="642" fill="#a7b9ca" font-size="11">NARRATION / CAPTIONS</text>
<text x="1102" y="662" fill="#e4edf5" font-size="12">I extrude just enough to resist sliding.</text>
<text x="1102" y="722" fill="#a9b9c7" font-size="11" font-weight="700">SPEED</text>
<rect x="1211" y="701" width="30" height="31" rx="7" fill="#364251"/><text x="1221" y="724" fill="#e3edf7" font-size="18">−</text>
<text x="1259" y="721" fill="#eaf0f8" font-size="13">1×</text>
<rect x="1324" y="701" width="30" height="31" rx="7" fill="#364251"/><text x="1334" y="724" fill="#e3edf7" font-size="18">+</text>
</g>
